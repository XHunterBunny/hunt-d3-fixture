name: Claude Issue Assistant

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          show_full_output: "true"
          prompt: |
            You are a repository assistant for ${{ github.repository }}.
            Issue #${{ github.event.issue.number }} has been opened.
            Issue title: ${{ github.event.issue.title }}
            Issue body: ${{ github.event.issue.body }}

            Carry out the request found in the issue. If the issue asks you to create a file, add the file to the repository default branch and push the change using the available GitHub tools. If the issue asks you to comment, post a short comment on the issue. Report back concisely.
          claude_args: |
            --max-turns 15
            --model claude-haiku-4-5
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(ls:*),Bash(pwd),mcp__github__create_or_update_file,mcp__github__push_files,mcp__github__add_issue_comment,mcp__github__get_issue,mcp__github__list_issues,mcp__github__get_me"
